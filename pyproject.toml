[project]
name = "robustness-gap"
version = "0.1.0"
description = "Certificate and attack errors in L-infinity robustness radii of small ReLU networks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "textual>=0.80",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
robustness-gap = "robustness_gap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robustness_gap"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
